<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the fast P. The svg is the tab icon (the 32px png is the backup for browsers that
         can't do svg). apple-touch-icon and the manifest icons are for saving the site to a
         phone home screen, those have a white P because iPhone dark mode drops the red
         background. The maskable one is shrunk so Android's round crop doesn't cut it -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0F1217" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
    <title>PitWall</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
