name: Lock Weekend Snapshot

# Locks the race weekend by calling POST /snapshot/auto on Render. All the "is it time
# yet" logic lives there: it checks the final session has finished AND OpenF1 has it
# (laps or, as a backup, the classification), that the weekend has no snapshot yet, and
# refuses outright if the race results are already in our data. Calling it when there's
# nothing to do is free, it just answers "idle" or "waiting".
#
# Why it loops now: on Mexico weekend this was set to run every 30 minutes, but GitHub
# actually ran it every 4 to 6 hours (31 Oct: 01:26, 07:25, 13:48, 18:17, 21:47 UTC).
# And OpenF1 blocks free users from about 30 minutes before a session until it ends, so
# between FP3 and quali there's only about 90 minutes to lock (Brazil: 16:00 to 17:30
# UTC). So instead of one poke per run, each run stays awake and asks every 5 minutes
# for up to ~6 hours (GitHub's limit for one job). Starts come every hour on Friday,
# Saturday and Sunday morning in UTC, so a late or dropped start never leaves the
# window uncovered. Free, the repo's public.
#
# Before that it was cron-job.org, which gave up on a request after 30s while Render
# takes ~53s to wake up. Bahrain (round 16) and Singapore (round 17) got lost that way.

on:
  schedule:
    # a start every hour, at 17 past because GitHub is busiest on the hour and drops
    # queued scheduled runs (about 5 of 48 starts ran on Mexico weekend). The concurrency
    # group below means one runs and the next waits to take over, so the lock never
    # hangs on one start. Sprint weekends lock on Friday's sprint qualifying, normal
    # weekends on Saturday's FP3, and Las Vegas's Saturday is Friday night in UTC
    - cron: "17 * * * 5,6"
    # Sunday catch up for anything that slipped through overnight
    - cron: "17 0-12 * * 0"
  workflow_dispatch: # and a Run workflow button for when you want to force it

# one run at a time, a new start waits for the running one instead of piling up
concurrency:
  group: lock-snapshot
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Keep asking the backend to lock this weekend
        env:
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
          BACKEND: https://formula-1-fantasy-predictor.onrender.com
        run: |
          if [ -z "$SNAPSHOT_SECRET" ]; then
            echo "::error::SNAPSHOT_SECRET isn't set as a repository secret, so the call would just 401."
            exit 1
          fi

          {
            echo "### Snapshot lock"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # stop a bit before GitHub's 6 hour limit so the run ends green, not killed
          deadline=$(( $(date +%s) + 345 * 60 ))

          while true; do
            # --max-time 180 covers Render waking up, --retry-all-errors covers the
            # connection errors you get mid wake
            code=$(curl -sS -o response.json -w '%{http_code}' \
              --max-time 180 --retry 3 --retry-delay 15 --retry-all-errors \
              -X POST "$BACKEND/snapshot/auto" \
              -H "X-Snapshot-Secret: $SNAPSHOT_SECRET" || true)
            status=$(python3 -c "import json; print(json.load(open('response.json')).get('status', ''))" 2>/dev/null || true)

            echo "$(date -u +%H:%M) UTC: HTTP $code $status"
            cat response.json 2>/dev/null || true
            echo
            echo "- $(date -u +%H:%M) UTC: HTTP \`$code\` \`$status\`" >> "$GITHUB_STEP_SUMMARY"

            # a wrong secret won't fix itself, so that's the one thing that goes red
            if [ "$code" = "401" ]; then
              echo "::error::401, the repo secret doesn't match SNAPSHOT_SECRET on Render."
              exit 1
            fi

            # done: locked already, nothing to lock, or too late (results are in)
            case "$code:$status" in
              2*:already_locked|2*:idle|2*:refused)
                {
                  echo ""
                  echo '```json'
                  cat response.json
                  echo ""
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
            esac

            # anything else (waiting, started, building, a 5xx, no answer while Render
            # restarts) means try again in 5 minutes
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Ran out of time, still not locked. The next scheduled run carries on." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 300
          done
